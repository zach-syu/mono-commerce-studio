name: App verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
          VITE_ANALYTICS_DISABLED: '1'
      - run: npm run test:preview
        id: free_preview
        if: always()
        env:
          CI: 'true'
          VITE_ANALYTICS_DISABLED: '1'
      - name: Build free layout review
        if: always() && steps.free_preview.outcome == 'success'
        run: npm run test:layout-report
      - name: Build evidence report
        if: always()
        run: npm run test:report
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-e2e-evidence
          path: |
            artifacts/e2e/
            artifacts/playwright-results.json
            artifacts/playwright-html/
            artifacts/layout-v2/
            public/report/
          retention-days: 7
